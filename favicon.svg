<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D95FF"/>
      <stop offset="1" stop-color="#0A5FE0"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#062A6B" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#bg)"/><rect width="512" height="512" rx="114" fill="url(#gloss)"/>
  <!-- 後ろのカード -->
  <g transform="rotate(-9 256 256)" filter="url(#sh)">
    <rect x="118" y="132" width="296" height="232" rx="30" fill="#FFFFFF" fill-opacity="0.55"/>
  </g>
  <!-- 手前のカード -->
  <g transform="rotate(4 256 256)" filter="url(#sh)">
    <rect x="98" y="160" width="316" height="236" rx="30" fill="#FFFFFF"/>
    <rect x="136" y="198" width="132" height="22" rx="11" fill="#007AFF"/>
    <rect x="136" y="244" width="240" height="14" rx="7" fill="#C9D4E3"/>
    <rect x="136" y="278" width="240" height="14" rx="7" fill="#C9D4E3"/>
    <rect x="136" y="312" width="164" height="14" rx="7" fill="#C9D4E3"/>
  </g>
</svg>
